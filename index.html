<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2b705">
<title>סידור עבודה - סמי טריילר מנוף</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eceff0; --surface:#ffffff; --soft:#f3f5f6; --ink:#1b2227; --muted:#58646d; --line:#d2d8dc;
  --accent:#f2b705; --accent-ink:#1b2227;
  --ok:#1d7a4b; --ok-bg:#dff1e6; --warn:#8f5600; --warn-bg:#fbefd2; --bad:#b42318;
  --f-display:'Rubik',system-ui,sans-serif; --f-body:'Assistant',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#13171a; --surface:#1c2226; --soft:#242c31; --ink:#e8ecee; --muted:#9aa6ae; --line:#2f383e;
    --ok:#52c68a; --ok-bg:#183626; --warn:#f0a94f; --warn-bg:#3a2c12; --bad:#f48175; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1.15rem;display:block;line-height:1.2}
.brand span{color:var(--muted);font-size:.85rem}
.tabs{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 16px;border-radius:8px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.datebar{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.datebar .d{flex:1;text-align:center;font-family:var(--f-display);font-weight:500;font-size:1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 .95rem var(--f-body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.small{min-height:38px;padding:0 12px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.icon{min-width:44px;padding:0}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:10px 12px;margin:12px 0;font-size:.95rem}
.summary{margin:10px 0 14px;color:var(--muted);font-size:.95rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.summary b{color:var(--ink);font-family:var(--f-display);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
form.new{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:16px}
form.new .full{grid-column:1/-1}
form.new h2{margin:0;font-family:var(--f-display);font-size:1.05rem;font-weight:600}
form.new label,.login label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=time],input[type=tel],input[type=email],input[type=password]{direction:ltr;text-align:right}
.login{max-width:420px;margin:12vh auto 0;padding:20px;display:grid;gap:14px}
.login h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.4rem}
.login p{margin:0;color:var(--muted)}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.drv{margin:0 0 18px}
.drv > header{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;flex-wrap:wrap}
.drv h2{margin:0;font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.veh{color:var(--muted);font-size:.88rem}
.none{color:var(--muted);font-size:.92rem;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.jobs{display:grid;gap:10px}
.job{padding:14px;display:grid;gap:10px}
.job .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.time{font-family:var(--f-display);font-weight:600;font-size:1.45rem;direction:ltr;unicode-bidi:isolate;line-height:1.1}
.time small{font-size:.8rem;color:var(--muted);font-weight:500;margin-inline-start:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
dl.f{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.98rem}
dl.f dt{color:var(--muted);font-size:.85rem;font-weight:600;padding-top:2px}
dl.f dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
a{color:inherit}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--soft)}
.picker{margin:12px 0 4px;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.big{min-height:52px;font-size:1.05rem;flex:1 1 200px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,14,17,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay img{max-width:100%;max-height:78vh;border-radius:8px;background:#fff}
.overlay .cap{color:#e8ecee;font-size:.95rem;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;text-align:center}
@media (max-width:480px){ form.new{grid-template-columns:1fr} .tabs button{padding:8px 12px} }
</style>
<script>
window.__errs=[];
addEventListener('error',function(e){window.__errs.push(e.message||'error')});
addEventListener('unhandledrejection',function(e){window.__errs.push(String((e.reason&&e.reason.message)||e.reason))});
setTimeout(function(){
  var r=document.getElementById('root');
  if(!r.querySelector('.login,.wrap')){
    r.textContent='';
    var d=document.createElement('div'); d.className='login card'; d.dir='ltr';
    d.textContent='App failed to load. '+window.__errs.join(' | ');
    r.appendChild(d);
  }
},6000);
</script>
</head>
<body>
<div id="root"><p style="text-align:center;margin-top:30vh;color:var(--muted)">טוען...</p></div>
<div id="layer"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword}
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,getDoc,query,where,onSnapshot}
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== להשלמה לפני העלאה ====== */
const firebaseConfig={
  apiKey:"AIzaSyCMVrNlP-2Wjj4j-1--N-Nm6oMbUH2UHdU",
  authDomain:"uzi-manofim.firebaseapp.com",
  projectId:"uzi-manofim",
  storageBucket:"uzi-manofim.firebasestorage.app",
  messagingSenderId:"425633549458",
  appId:"1:425633549458:web:aaacd90c91d44e82316a4b"
};
const MANAGER_EMAIL="aviabayev1992@gmail.com";
/* =============================== */

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=ymd(new Date());
const fmtDate=s=>parse(s).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const hhmm=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const jobsWord=n=>n===1?'עבודה אחת':n+' עבודות';
const phoneEmail=p=>p.replace(/\D/g,'')+'@drivers.uzi-manofim.app';
const sorted=a=>a.slice().sort((x,y)=>(x.reportTime||'').localeCompare(y.reportTime||''));

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false)continue; e.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return e;
}
function toast(msg){ const t=h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),3500); }
const root=document.getElementById('root');

if(firebaseConfig.apiKey.startsWith('PASTE')||MANAGER_EMAIL.startsWith('PASTE')){
  root.append(h('div',{class:'login card'},h('h1',{},'האפליקציה עוד לא הוגדרה'),h('p',{},'צריך להדביק בקובץ את הגדרות Firebase ואת כתובת המייל של הסדרן.')));
  throw new Error('config missing');
}

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const S={user:null,isMgr:false,view:'board',date:today,jobs:[],drivers:[],myDriver:null,ready:false,formOpen:false,busy:{}};
let unsubs=[];
const stopAll=()=>{unsubs.forEach(u=>u());unsubs=[];};
let jobsUnsub=null;
const withDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));

async function run(p,okMsg){
  try{ await p; if(okMsg) toast(okMsg); return true; }
  catch(e){ console.error(e); toast(e&&e.code==='permission-denied'?'אין הרשאה לפעולה הזו':'הפעולה נכשלה, נסה שוב'); return false; }
}

/* ---------- login ---------- */
function showLogin(){
  stopAll(); if(jobsUnsub){jobsUnsub();jobsUnsub=null;}
  const err=h('div',{class:'err',role:'alert'});
  const u=h('input',{id:'u',type:'text',autocomplete:'username',autocapitalize:'none',inputmode:'email',required:true,placeholder:'מספר טלפון'});
  const p=h('input',{id:'p',type:'password',autocomplete:'current-password',required:true});
  const btn=h('button',{class:'btn primary',type:'submit'},'כניסה');
  root.replaceChildren(h('form',{class:'login card',onsubmit:async ev=>{
    ev.preventDefault(); err.textContent=''; btn.disabled=true;
    const name=u.value.trim(); const email=name.includes('@')?name:phoneEmail(name);
    try{ await signInWithEmailAndPassword(auth,email,p.value); }
    catch(e){ err.textContent=(e.code==='auth/network-request-failed')?'אין חיבור לאינטרנט':'שם משתמש או סיסמה שגויים'; }
    btn.disabled=false;
  }},
    h('h1',{},'סידור עבודה'),h('p',{},'סמי טריילר מנוף'),
    h('label',{for:'u'},'מספר טלפון (נהג) או מייל (סדרן)',u),
    h('label',{for:'p'},'סיסמה',p),err,btn));
}

/* ---------- data ---------- */
function watchJobs(){
  if(jobsUnsub){jobsUnsub();jobsUnsub=null;}
  S.ready=false;
  const q=S.isMgr
    ?query(collection(db,'jobs'),where('date','==',S.date))
    :query(collection(db,'jobs'),where('driverUid','==',S.user.uid),where('date','==',S.date));
  jobsUnsub=onSnapshot(q,s=>{S.jobs=withDocs(s);S.ready=true;render();},()=>toast('החיבור לנתונים נקטע, טען מחדש'));
}
function startSession(user){
  S.user=user; S.isMgr=(user.email||'').toLowerCase()===MANAGER_EMAIL.toLowerCase();
  S.view='board'; S.date=today; S.jobs=[]; S.drivers=[]; S.myDriver=null;
  if(S.isMgr){
    unsubs.push(onSnapshot(collection(db,'drivers'),s=>{S.drivers=withDocs(s).sort((a,b)=>a.name.localeCompare(b.name,'he'));render();},()=>toast('לא ניתן לטעון נהגים')));
  }else{
    unsubs.push(onSnapshot(query(collection(db,'drivers'),where('uid','==',user.uid)),s=>{S.myDriver=withDocs(s)[0]||null;render();}));
  }
  watchJobs(); render();
}
function setDate(d){S.date=d;S.jobs=[];watchJobs();render();}

/* ---------- photos ---------- */
async function shrink(file,max,q,limit){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  let out=c.toDataURL('image/jpeg',q);
  while(out.length>limit&&q>0.3){q-=0.1;out=c.toDataURL('image/jpeg',q);}
  return out;
}
async function sendPhoto(job,file){
  if(!file)return;
  S.busy[job.id]=true; render();
  try{
    const data=await shrink(file,1200,0.65,220000);
    const thumb=await shrink(file,200,0.6,30000);
    await setDoc(doc(db,'photos',job.id),{data,driverUid:S.user.uid});
    await updateDoc(doc(db,'jobs',job.id),{photoAt:new Date().toISOString(),thumb});
    toast('התעודה נשלחה לסדרן');
  }catch(e){ console.error(e); toast('השליחה נכשלה, נסה שוב'); }
  delete S.busy[job.id]; render();
}
async function showPhoto(job){
  const layer=document.getElementById('layer'); const close=()=>layer.replaceChildren();
  layer.replaceChildren(h('div',{class:'overlay',onclick:close},h('div',{class:'cap'},'טוען תעודה...')));
  let data=null; try{ const s=await getDoc(doc(db,'photos',job.id)); data=s.exists()?s.data().data:null; }catch(e){}
  const drv=S.drivers.find(d=>d.id===job.driverId);
  const cap=(drv?drv.name+' · ':'')+(job.customer||'')+(job.photoAt?' · נשלח '+hhmm(job.photoAt):'');
  layer.replaceChildren(h('div',{class:'overlay',onclick:close},
    data?h('img',{src:data,alt:'תעודת עבודה'}):h('div',{class:'cap'},'התמונה לא נמצאה'),
    h('div',{class:'cap'},cap),h('button',{class:'btn',type:'button',onclick:close},'סגור')));
}

/* ---------- shared pieces ---------- */
const timeBlock=j=>h('div',{class:'time'},(j.reportTime||'--:--')+' – '+(j.endTime||'--:--'),h('small',{},'התייצבות / סיום'));
function fields(j){
  const rows=[];
  if(j.customer) rows.push(['לקוח',j.customer]);
  if(j.task) rows.push(['עבודה',j.task]);
  if(j.location) rows.push(['מיקום',h('span',{},j.location,' ',h('a',{href:'https://waze.com/ul?q='+encodeURIComponent(j.location)+'&navigate=yes',target:'_blank',rel:'noopener'},'ניווט'))]);
  if(j.phone) rows.push(['טלפון לקוח',h('span',{},h('span',{class:'ltr'},j.phone),' ',h('a',{href:'tel:'+j.phone.replace(/[^\d+]/g,'')},'חיוג'))]);
  if(j.notes) rows.push(['הערות',j.notes]);
  return h('dl',{class:'f'},rows.map(r=>[h('dt',{},r[0]),h('dd',{},r[1])]));
}
const statusPills=j=>h('div',{class:'pills'},
  j.confirmedAt?h('span',{class:'pill ok'},'אישר קבלה '+hhmm(j.confirmedAt)):h('span',{class:'pill warn'},'ממתין לאישור'),
  j.photoAt?h('span',{class:'pill ok'},'תעודה התקבלה '+hhmm(j.photoAt)):h('span',{class:'pill'},'ממתין לתעודה'));
const field=(id,label,el,full)=>{el.id=id;return h('label',{for:id,class:full?'full':''},label,el);};

/* ---------- manager: add job form (built once so typing survives updates) ---------- */
const jf={};
const jobForm=h('form',{class:'card new',hidden:true,onsubmit:async ev=>{
  ev.preventDefault();
  const drv=S.drivers.find(d=>d.id===jf.driver.value); if(!drv)return;
  const job={date:S.date,driverId:drv.id,driverUid:drv.uid,reportTime:jf.start.value,endTime:jf.end.value,customer:jf.customer.value.trim(),
    phone:jf.phone.value.trim(),location:jf.loc.value.trim(),task:jf.task.value.trim(),notes:jf.notes.value.trim(),createdAt:new Date().toISOString()};
  if(await run(addDoc(collection(db,'jobs'),job),'העבודה נוספה לסידור')){
    ['customer','phone','loc','task','notes'].forEach(k=>jf[k].value=''); S.formOpen=false; render();
  }
}},
  h('h2',{class:'full'},'עבודה חדשה'),
  (jf.driver=h('select',{required:true}),field('jDriver','נהג',jf.driver,true)),
  (jf.start=h('input',{type:'time',required:true,value:'07:00'}),field('jStart','שעת התייצבות',jf.start)),
  (jf.end=h('input',{type:'time',value:'17:00'}),field('jEnd','שעת סיום',jf.end)),
  (jf.customer=h('input',{type:'text',autocomplete:'off'}),field('jCustomer','שם הלקוח',jf.customer)),
  (jf.phone=h('input',{type:'tel',inputmode:'tel',autocomplete:'off'}),field('jPhone','טלפון הלקוח',jf.phone)),
  (jf.loc=h('input',{type:'text',required:true,autocomplete:'off',placeholder:'כתובת או שם אתר'}),field('jLoc','מיקום',jf.loc,true)),
  (jf.task=h('textarea',{}),field('jTask','מה לעשות',jf.task,true)),
  (jf.notes=h('input',{type:'text',autocomplete:'off'}),field('jNotes','הערות לנהג',jf.notes,true)),
  h('div',{class:'acts full'},h('button',{class:'btn primary',type:'submit'},'הוסף לסידור'),
    h('button',{class:'btn',type:'button',onclick:()=>{S.formOpen=false;render();}},'ביטול')));

function fillDriverSelect(){
  const cur=jf.driver.value;
  jf.driver.replaceChildren(...S.drivers.map(d=>h('option',{value:d.id},d.name+' · '+d.vehicle)));
  if(cur) jf.driver.value=cur;
}

function mgrJob(j){
  return h('article',{class:'card job'},
    h('div',{class:'row1'},timeBlock(j),statusPills(j)),fields(j),
    h('div',{class:'acts'},
      j.thumb?h('img',{class:'thumb',src:j.thumb,alt:'תעודת עבודה',onclick:()=>showPhoto(j)}):null,
      j.photoAt?h('button',{class:'btn small',type:'button',onclick:()=>showPhoto(j)},'פתח תעודה'):null,
      h('button',{class:'btn small',type:'button',onclick:()=>{
        const {id,confirmedAt,photoAt,thumb,...rest}=j;
        run(addDoc(collection(db,'jobs'),{...rest,date:addDays(S.date,1),createdAt:new Date().toISOString()}),'הועתק ל'+fmtDate(addDays(S.date,1)));
      }},'שכפל למחר'),
      h('button',{class:'btn small danger',type:'button',onclick:ev=>{
        const b=ev.currentTarget;
        if(b.dataset.armed){ run((async()=>{ await deleteDoc(doc(db,'jobs',j.id)); try{await deleteDoc(doc(db,'photos',j.id));}catch(e){} })(),'העבודה נמחקה'); return; }
        b.dataset.armed='1'; b.textContent='לחץ שוב למחיקה'; setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='מחק';}},3000);
      }},'מחק')));
}
function boardView(){
  const jobs=S.jobs, conf=jobs.filter(j=>j.confirmedAt).length, docs=jobs.filter(j=>j.photoAt).length;
  fillDriverSelect(); jobForm.hidden=!S.formOpen;
  const out=[
    h('p',{class:'summary'},h('span',{},h('b',{},jobsWord(jobs.length))),h('span',{},h('b',{},conf),' אישרו קבלה'),h('span',{},h('b',{},docs),' תעודות התקבלו')),
    S.drivers.length
      ?h('div',{class:'toolbar'},h('button',{class:'btn primary',type:'button',onclick:()=>{S.formOpen=!S.formOpen;render();}},S.formOpen?'סגור טופס':'הוסף עבודה'))
      :h('div',{class:'banner'},'עוד אין נהגים. עבור ללשונית "נהגים" והוסף את הנהגים כדי לרשום להם עבודות.'),
    jobForm];
  if(S.ready&&!jobs.length&&!S.formOpen&&S.drivers.length) out.push(h('div',{class:'empty card'},h('b',{},'אין עבודות ב'+fmtDate(S.date)),'לחץ על "הוסף עבודה" כדי לרשום את הסידור ליום הזה.'));
  S.drivers.forEach(d=>{
    const mine=sorted(jobs.filter(j=>j.driverId===d.id));
    out.push(h('section',{class:'drv'},
      h('header',{},h('h2',{},d.name),h('span',{class:'veh'},d.vehicle),h('span',{class:'veh'},'· '+(mine.length?jobsWord(mine.length):'פנוי'))),
      mine.length?h('div',{class:'jobs'},mine.map(mgrJob)):(jobs.length?h('div',{class:'none'},'אין עבודה ליום הזה'):null)));
  });
  return out;
}

/* ---------- manager: drivers tab ---------- */
const df={};
const driverForm=h('form',{class:'card new',onsubmit:async ev=>{
  ev.preventDefault();
  const name=df.name.value.trim(), vehicle=df.vehicle.value.trim(), phone=df.phone.value.replace(/\D/g,''), pw=df.pw.value;
  if(pw.length<6){toast('הסיסמה חייבת להיות לפחות 6 תווים');return;}
  const btn=ev.submitter; if(btn)btn.disabled=true;
  try{
    const app2=initializeApp(firebaseConfig,'second-'+Date.now());
    const auth2=getAuth(app2);
    const cred=await createUserWithEmailAndPassword(auth2,phoneEmail(phone),pw);
    await signOut(auth2);
    await addDoc(collection(db,'drivers'),{name,vehicle,phone,uid:cred.user.uid,createdAt:new Date().toISOString()});
    ['name','vehicle','phone','pw'].forEach(k=>df[k].value=''); toast('הנהג נוסף. הוא נכנס עם מספר הטלפון והסיסמה');
  }catch(e){ console.error(e); toast(e.code==='auth/email-already-in-use'?'מספר הטלפון הזה כבר רשום':'ההוספה נכשלה'); }
  if(btn)btn.disabled=false;
}},
  h('h2',{class:'full'},'נהג חדש'),
  (df.name=h('input',{type:'text',required:true,autocomplete:'off'}),field('dName','שם',df.name)),
  (df.vehicle=h('input',{type:'text',required:true,autocomplete:'off',placeholder:'למשל מנוף סמי 100'}),field('dVeh','רכב',df.vehicle)),
  (df.phone=h('input',{type:'tel',inputmode:'tel',required:true,autocomplete:'off'}),field('dPhone','טלפון (שם המשתמש של הנהג)',df.phone)),
  (df.pw=h('input',{type:'text',required:true,minlength:'6',autocomplete:'off'}),field('dPw','סיסמה לנהג (לפחות 6 תווים)',df.pw)),
  h('div',{class:'full'},h('button',{class:'btn primary',type:'submit'},'הוסף נהג')));
function driversView(){
  return [driverForm,
    h('div',{class:'jobs'},S.drivers.length?S.drivers.map(d=>h('div',{class:'card row'},
      h('div',{},h('b',{},d.name),' ',h('span',{class:'veh'},d.vehicle+' · '),h('span',{class:'veh ltr'},d.phone)),
      h('button',{class:'btn small danger',type:'button',onclick:ev=>{
        const b=ev.currentTarget;
        if(b.dataset.armed){ run(deleteDoc(doc(db,'drivers',d.id)),'הנהג הוסר מהרשימה'); return; }
        b.dataset.armed='1'; b.textContent='לחץ שוב להסרה'; setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='הסר';}},3000);
      }},'הסר'))):h('div',{class:'none'},'עוד אין נהגים ברשימה.')),
    h('p',{class:'veh'},'הסרה מהרשימה לא מוחקת את הכניסה של הנהג. כדי לחסום כניסה מחק אותו גם ב-Firebase, בלשונית Authentication.')];
}

/* ---------- driver view ---------- */
function driverJob(j){
  const photoBtn=S.busy[j.id]
    ?h('button',{class:'btn big',type:'button',disabled:true},'שולח תעודה...')
    :h('label',{class:'btn big'+(j.photoAt?'':' primary'),for:'cam-'+j.id},j.photoAt?'החלף תמונה של התעודה':'צלם תעודת עבודה',
        h('input',{id:'cam-'+j.id,type:'file',accept:'image/*',capture:'environment',hidden:true,onchange:ev=>sendPhoto(j,ev.target.files[0])}));
  return h('article',{class:'card job'},
    h('div',{class:'row1'},timeBlock(j)),fields(j),
    j.confirmedAt
      ?h('div',{class:'pills'},h('span',{class:'pill ok'},'אישרת קבלה ב־'+hhmm(j.confirmedAt)))
      :h('button',{class:'btn primary big',type:'button',onclick:()=>run(updateDoc(doc(db,'jobs',j.id),{confirmedAt:new Date().toISOString()}),'האישור נשלח לסדרן')},'אישרתי קבלת סידור'),
    h('div',{class:'acts'},photoBtn,j.thumb?h('img',{class:'thumb',src:j.thumb,alt:'התעודה ששלחת',onclick:()=>showPhoto(j)}):null),
    j.photoAt?h('div',{class:'pills'},h('span',{class:'pill ok'},'התעודה נשלחה לסדרן ב־'+hhmm(j.photoAt))):null);
}
function driverView(){
  const mine=sorted(S.jobs);
  const out=[h('div',{class:'picker'},S.myDriver?'שלום '+S.myDriver.name+' · '+S.myDriver.vehicle:'')];
  if(!S.ready) out.push(h('div',{class:'empty'},'טוען סידור...'));
  else if(!mine.length) out.push(h('div',{class:'empty card'},h('b',{},'אין לך עבודה ב'+fmtDate(S.date)),'אם הסידור עוד לא פורסם, נסה שוב בהמשך.'));
  else out.push(h('div',{class:'jobs',style:'margin-top:12px'},mine.map(driverJob)));
  return out;
}

/* ---------- shell ---------- */
const dateLbl=h('div',{class:'d'});
const shell=h('div',{class:'wrap'});
const main=h('main',{});
const tabBoard=h('button',{type:'button',onclick:()=>{S.view='board';render();}},'סידור');
const tabDrivers=h('button',{type:'button',onclick:()=>{S.view='drivers';render();}},'נהגים');
shell.append(
  h('header',{class:'top'},h('div',{class:'in'},
    h('div',{class:'brand'},h('b',{},'סידור עבודה'),h('span',{},'סמי טריילר מנוף')),
    h('div',{class:'acts'},h('div',{class:'tabs',id:'tabs'},tabBoard,tabDrivers),
      h('button',{class:'btn small',type:'button',onclick:()=>signOut(auth)},'יציאה')))),
  h('div',{class:'datebar',id:'datebar'},
    h('button',{class:'btn icon',type:'button','aria-label':'היום הבא',onclick:()=>setDate(addDays(S.date,1))},'›'),dateLbl,
    h('button',{class:'btn icon',type:'button','aria-label':'היום הקודם',onclick:()=>setDate(addDays(S.date,-1))},'‹'),
    h('button',{class:'btn small',type:'button',onclick:()=>setDate(today)},'היום')),
  main);

function render(){
  if(!S.user)return;
  if(!root.contains(shell)) root.replaceChildren(shell);
  document.getElementById('tabs').hidden=!S.isMgr;
  tabBoard.setAttribute('aria-pressed',S.view==='board'); tabDrivers.setAttribute('aria-pressed',S.view==='drivers');
  const showDate=!(S.isMgr&&S.view==='drivers'); document.getElementById('datebar').hidden=!showDate;
  dateLbl.textContent=(S.date===today?'היום, ':'')+fmtDate(S.date);
  main.replaceChildren(...(S.isMgr?(S.view==='drivers'?driversView():boardView()):driverView()));
}

onAuthStateChanged(auth,user=>{
  if(user) startSession(user);
  else { S.user=null; showLogin(); }
});
</script>
</body>
</html>

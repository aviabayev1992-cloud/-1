.tabs{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 16px;border-radius:8px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.datebar{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.datebar .d{flex:1;text-align:center;font-family:var(--f-display);font-weight:500;font-size:1.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

.summary b{color:var(--ink);font-family:var(--f-display);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
form.new{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:16px}
form.new .full{grid-column:1/-1}
form.new h2{margin:0;font-family:var(--f-display);font-size:1.05rem;font-weight:600}
form.new label,.login label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=time],input[type=tel],input[type=email],input[type=password]{direction:ltr;text-align:right}
.login{max-width:420px;margin:12vh auto 0;padding:20px;display:grid;gap:14px}
.login h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.4rem}

.err{color:var(--bad);font-weight:600;min-height:1.4em}
.drv{margin:0 0 18px}
.drv > header{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;flex-wrap:wrap}
.drv h2{margin:0;font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.veh{color:var(--muted);font-size:.88rem}
.none{color:var(--muted);font-size:.92rem;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.jobs{display:grid;gap:10px}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
dl.f{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.98rem}
dl.f dt{color:var(--muted);font-size:.85rem;font-weight:600;padding-top:2px}
dl.f dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
a{color:inherit}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--soft)}
.picker{margin:12px 0 4px;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.big{min-height:52px;font-size:1.05rem;flex:1 1 200px}

.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

.install span{flex:1 1 200px;font-size:.92rem}
.sec{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:24px 2px 10px}

  const e=document.createElement(tag);

/* ---------- install banner: Android install button, iPhone instructions ---------- */
(function(){
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone) return;
  try{ if(localStorage.getItem('noInstall')==='1') return; }catch(e){}
  const ua=navigator.userAgent;
  const ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inApp=/FBAN|FBAV|Instagram|Line\/|; wv\)/i.test(ua);
  let deferred=null, mode=null;
  const msg=h('span',{});
  const act=h('button',{class:'btn small primary',type:'button',hidden:true,onclick:async()=>{ try{ deferred.prompt(); await deferred.userChoice; }catch(_){} deferred=null; mode=null; paint(); }});
  const closeBtn=h('button',{class:'btn small',type:'button',onclick:()=>{bar.hidden=true;try{localStorage.setItem('noInstall','1');}catch(e){}}},'✕');
  const bar=h('div',{class:'install',hidden:true,role:'region'},msg,act,closeBtn);
  document.body.append(bar);
  function paint(){
    if(!mode){ bar.hidden=true; return; }
    bar.setAttribute('aria-label',t('install')); closeBtn.setAttribute('aria-label',t('close'));
    if(mode==='prompt'){ msg.textContent=t('installPrompt'); act.textContent=t('installBtn'); act.hidden=false; }
    else { msg.textContent=t(mode==='inapp'?'installInApp':'installIos'); act.hidden=true; }
    bar.hidden=false;
  }
  refreshInstall=paint;
  addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; mode='prompt'; paint(); });
  addEventListener('appinstalled',()=>{ mode=null; paint(); });
  if(inApp){ mode='inapp'; paint(); } else if(ios){ mode='ios'; paint(); }
})();

let prevJobs=null;
function watchJobs(){
  if(jobsUnsub){jobsUnsub();jobsUnsub=null;}
  S.ready=false; prevJobs=null; S.pack=null;
  const q=S.isMgr
    ?query(collection(db,'jobs'),where('date','==',S.date))
    :query(collection(db,'jobs'),where('driverUid','==',S.user.uid));
  jobsUnsub=onSnapshot(q,s=>{
    const list=withDocs(s);
    if(prevJobs){
      list.forEach(j=>{
        const old=prevJobs.get(j.id);
        const who=(S.drivers.find(d=>d.id===j.driverId)||{}).name||'נהג';
        if(S.isMgr){
          if(old&&!old.confirmedAt&&j.confirmedAt) toast(who+' אישר קבלת סידור');
          if(old&&!old.photoAt&&j.photoAt) toast('התקבלה תעודה מ'+who);
        }else if(!old){ toast(t('newJob')); }
      });
    }
    prevJobs=new Map(list.map(j=>[j.id,j]));
    S.dbErr=null;
    if(S.isMgr) S.jobs=list; else { S.mine=list; deriveMine(); }
    S.ready=true; render();
  },e=>{ S.dbErr=(e&&(e.code||e.message))||'unknown'; S.ready=true; toast(t('dbLost')); render(); });
}
async function startSession(user){
  const email=(user.email||'').toLowerCase();
  const owner=email===MANAGER_EMAIL.toLowerCase();
  let mgr=owner;
  if(!mgr){ try{ mgr=(await getDoc(doc(db,'managers',email))).exists(); }catch(e){ mgr=false; } }
  if(!auth.currentUser||auth.currentUser.uid!==user.uid) return;
  S.user=user; S.isOwner=owner; S.isMgr=mgr; S.managers=[];
  applyLang(mgr?'he':savedLang());
  S.view='board'; S.date=today; S.upcoming=true; S.mine=[]; S.jobs=[]; S.drivers=[]; S.myDriver=null; S.yearData=null; S.pack=null;
  if(S.isMgr){

    unsubs.push(onSnapshot(collection(db,'drivers'),s=>{S.drivers=withDocs(s).sort((a,b)=>a.name.localeCompare(b.name,'he'));render();},()=>toast('לא ניתן לטעון נהגים')));

    unsubs.push(onSnapshot(query(collection(db,'drivers'),where('uid','==',user.uid)),s=>{S.myDriver=withDocs(s)[0]||null;render();}));
  }
  watchJobs(); render();
}
function deriveMine(){ S.jobs=S.upcoming?S.mine.filter(j=>j.date>=today):S.mine.filter(j=>j.date===S.date); }

/* ---------- photos ---------- */
async function shrink(file,max,q,limit){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  let out=c.toDataURL('image/jpeg',q);
  while(out.length>limit&&q>0.3){q-=0.1;out=c.toDataURL('image/jpeg',q);}
  return out;
}
async function sendPhoto(job,file){
  if(!file)return;
  S.busy[job.id]=true; render();
  try{

    await updateDoc(doc(db,'jobs',job.id),{photoAt:new Date().toISOString()});
    toast(t('docSent'));
  }catch(e){ console.error(e); toast(t('sendFail')); }
  delete S.busy[job.id]; render();
}

/* ---------- manager: send the day's work orders by email (via the phone's share sheet) ---------- */
async function preparePack(){
  S.packing=true; render();
  try{
    const out=[]; let i=0;
    for(const j of S.jobs.filter(j=>j.photoAt)){
      const snap=await getDoc(doc(db,'photos',j.id)); if(!snap.exists())continue;
      const blob=await (await fetch(snap.data().data)).blob();
      const drv=S.drivers.find(d=>d.id===j.driverId);
      i++;
      const name=((drv?drv.name:'נהג')+'-'+(j.customer||'עבודה')+'-'+j.date+'-'+i+'.jpg').replace(/[\\/:*?"<>|]+/g,'_');
      const file=new File([blob],name,{type:'image/jpeg'});
      out.push({file,name,url:URL.createObjectURL(file)});
    }
    S.pack=out;
  }catch(e){ console.error(e); toast('ההכנה נכשלה, נסה שוב'); }
  S.packing=false; render();
}
async function sharePack(){
  try{ await navigator.share({files:S.pack.map(p=>p.file),title:'תעודות עבודה '+fmtDate(S.date)}); }
  catch(e){ if(e&&e.name!=='AbortError') toast('השיתוף נכשל'); }

function packBox(){

const DOWS={he:['א','ב','ג','ד','ה','ו','ש'],ru:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],en:['Su','Mo','Tu','We','Th','Fr','Sa']};
const monthName=(y,m)=>{ const x=new Date(y,m,1).toLocaleDateString(LANGS[LANG].locale,{month:'long'}); return x.charAt(0).toUpperCase()+x.slice(1); };
async function loadYear(force){
  if(!force&&S.yearData&&S.yearData.year===S.year){render();return;}
  S.yearLoading=true; render();
  try{
    const y=S.year;
    const q=S.isMgr
      ?query(collection(db,'jobs'),where('date','>=',y+'-01-01'),where('date','<=',y+'-12-31'))
      :query(collection(db,'jobs'),where('driverUid','==',S.user.uid));
    const snap=await getDocs(q);
    const days={};
    snap.forEach(d=>{ const j=d.data(); if(!j.date||j.date.slice(0,4)!==String(y))return; const o=days[j.date]||(days[j.date]={n:0,wait:0}); o.n++; if(!j.confirmedAt)o.wait++; });
    S.yearData={year:y,days};
  }catch(e){ console.error(e); toast(t('calFail')); }
  S.yearLoading=false; render();
}
function yearView(){
  const y=S.year, data=(S.yearData&&S.yearData.year===y)?S.yearData.days:{};
  const out=[
    h('div',{class:'yearbar'},
      h('button',{class:'btn icon',type:'button','aria-label':t('nextYear'),onclick:()=>{S.year++;loadYear();}},'›'),
      h('b',{},String(y)),
      h('button',{class:'btn icon',type:'button','aria-label':t('prevYear'),onclick:()=>{S.year--;loadYear();}},'‹'),
      h('button',{class:'btn small',type:'button',disabled:S.yearLoading,onclick:()=>loadYear(true)},S.yearLoading?'…':t('refresh'))),
    h('p',{class:'legend'},h('span',{},h('i',{style:'background:var(--accent-soft)'}),t('legendHas')),h('span',{},h('i',{style:'border:2px solid var(--warn)'}),S.isMgr?t('legendWaitMgr'):t('legendWaitDrv')))];
  const grid=h('div',{class:'months'});
  for(let m=0;m<12;m++){
    const first=new Date(y,m,1), count=new Date(y,m+1,0).getDate(), cells=[];
    for(let i=0;i<first.getDay();i++) cells.push(h('span',{class:'dc off'}));
    for(let d=1;d<=count;d++){
      const ds=y+'-'+pad(m+1)+'-'+pad(d), info=data[ds];
      cells.push(h('button',{type:'button',class:'dc'+(info?' has':'')+(info&&info.wait?' wait':'')+(ds===today?' today':''),
        'aria-label':fmtDate(ds)+(info?', '+jobsWord(info.n):''),onclick:()=>{S.view='board';setDate(ds);}},
        h('span',{},String(d)),info?h('small',{},String(info.n)):null));
    }
    grid.append(h('section',{class:'month card'},h('h3',{},monthName(y,m)),h('div',{class:'dow'},DOWS[LANG].map(x=>h('span',{},x))),h('div',{class:'days'},cells)));
  }
  out.push(grid);
  return out;
}

/* ---------- manager: managers list ---------- */
const mf={};
const managerForm=h('form',{class:'card new',onsubmit:async ev=>{
  ev.preventDefault();
  const username=mf.email.value.trim().toLowerCase(), pw=mf.pw.value;
  if(!/^[a-z0-9._-]{3,}$/.test(username)||!/[a-z]/.test(username)){toast('שם משתמש: לפחות 3 תווים באנגלית, אפשר גם מספרים. חייבת להיות בו לפחות אות אחת');return;}
  const email=userEmail(username);
  if(pw.length<6){toast('הסיסמה חייבת להיות לפחות 6 תווים');return;}
  const btn=ev.submitter; if(btn)btn.disabled=true;
  try{
    const app2=initializeApp(firebaseConfig,'second-'+Date.now());
    const auth2=getAuth(app2);
    let existed=false;
    try{ await createUserWithEmailAndPassword(auth2,email,pw); await signOut(auth2); }
    catch(e){ if(e.code==='auth/email-already-in-use') existed=true; else throw e; }
    await setDoc(doc(db,'managers',email),{email,username,addedAt:new Date().toISOString()});
    mf.email.value=''; mf.pw.value='';
    toast(existed?'שם המשתמש כבר היה רשום. נוספה לו הרשאת ניהול, והסיסמה שלו נשארה כמו שהייתה':'המנהל נוסף. הוא נכנס עם שם המשתמש והסיסמה');
  }catch(e){ console.error(e); toast(e&&e.code==='permission-denied'?'רק הבעלים יכול להוסיף מנהלים':'ההוספה נכשלה'); }
  if(btn)btn.disabled=false;
}},
  h('h2',{class:'full'},'מנהל חדש'),
  (mf.email=h('input',{type:'text',required:true,autocomplete:'off',autocapitalize:'none',spellcheck:'false',placeholder:'למשל dan.cohen'}),field('mEmail','שם משתמש באנגלית',mf.email,true)),
  (mf.pw=h('input',{type:'text',required:true,minlength:'6',autocomplete:'off'}),field('mPw','סיסמה (לפחות 6 תווים)',mf.pw,true)),
  h('div',{class:'full'},h('button',{class:'btn primary',type:'submit'},'הוסף מנהל')));
function managersSection(){
  const out=[h('h2',{class:'sec'},'מנהלים')];
  if(S.isOwner) out.push(managerForm);
  out.push(h('div',{class:'jobs'},
    h('div',{class:'card row'},h('div',{},h('b',{},'בעלים'),' ',h('span',{class:'veh ltr'},MANAGER_EMAIL))),
    S.managers.map(m=>h('div',{class:'card row'},
      h('div',{},h('b',{},'מנהל'),' ',h('span',{class:'veh ltr'},m.username||m.email)),
      S.isOwner?h('button',{class:'btn small danger',type:'button',onclick:ev=>{
        const b=ev.currentTarget;
        if(b.dataset.armed){ run(deleteDoc(doc(db,'managers',m.id)),'הרשאת הניהול הוסרה'); return; }
        b.dataset.armed='1'; b.textContent='לחץ שוב להסרה'; setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='הסר הרשאה';}},3000);
      }},'הסר הרשאה'):null))));
  out.push(h('p',{class:'veh'},S.isOwner
    ?'מנהלים יכולים לעשות הכול חוץ מלהוסיף ולהסיר מנהלים. המנהל נכנס עם שם המשתמש והסיסמה שהגדרת. הסרת הרשאה לא מוחקת את הכניסה שלו. כדי לחסום אותו לגמרי מחק אותו גם ב-Firebase, בלשונית Authentication.'
    :'רק הבעלים יכול להוסיף ולהסיר מנהלים.'));
  return out;
}

/* ---------- manager: drivers tab ---------- */
const df={};
const driverForm=h('form',{class:'card new',onsubmit:async ev=>{
  ev.preventDefault();
  const name=df.name.value.trim(), vehicle=df.vehicle.value.trim(), phone=df.phone.value.replace(/\D/g,''), pw=df.pw.value;
  if(pw.length<6){toast('הסיסמה חייבת להיות לפחות 6 תווים');return;}
  const btn=ev.submitter; if(btn)btn.disabled=true;
  try{
    const app2=initializeApp(firebaseConfig,'second-'+Date.now());
    const auth2=getAuth(app2);
    let uid, created=true;
    try{ const cred=await createUserWithEmailAndPassword(auth2,phoneEmail(phone),pw); uid=cred.user.uid; }
    catch(e){
      if(e.code!=='auth/email-already-in-use') throw e;
      created=false;
      const cred=await signInWithEmailAndPassword(auth2,phoneEmail(phone),pw); uid=cred.user.uid;
    }
    await signOut(auth2);
    await addDoc(collection(db,'drivers'),{name,vehicle,phone,uid,createdAt:new Date().toISOString()});
    ['name','vehicle','phone','pw'].forEach(k=>df[k].value='');
    toast(created?'הנהג נוסף. הוא נכנס עם מספר הטלפון והסיסמה':'הכניסה של הטלפון הזה כבר הייתה קיימת, והנהג קושר אליה');
  }catch(e){ console.error(e);
    toast((e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')?'מספר הטלפון הזה כבר רשום עם סיסמה אחרת. הקלד את הסיסמה הנוכחית שלו':'ההוספה נכשלה'); }
  if(btn)btn.disabled=false;
}},
  h('h2',{class:'full'},'נהג חדש'),
  (df.name=h('input',{type:'text',required:true,autocomplete:'off'}),field('dName','שם',df.name)),
  (df.vehicle=h('input',{type:'text',required:true,autocomplete:'off',placeholder:'למשל מנוף סמי 100'}),field('dVeh','רכב',df.vehicle)),
  (df.phone=h('input',{type:'tel',inputmode:'tel',required:true,autocomplete:'off'}),field('dPhone','טלפון (שם המשתמש של הנהג)',df.phone)),
  (df.pw=h('input',{type:'text',required:true,minlength:'6',autocomplete:'off'}),field('dPw','סיסמה לנהג (לפחות 6 תווים)',df.pw)),
  h('div',{class:'full'},h('button',{class:'btn primary',type:'submit'},'הוסף נהג')));
/* ---------- manager: re-link a driver to the current login ---------- */
const relinkPw=h('input',{id:'rpw',type:'text',autocomplete:'off',placeholder:'הסיסמה הנוכחית של הנהג',style:'max-width:240px'});
async function relinkDriver(d,pw){
  try{
    const app2=initializeApp(firebaseConfig,'relink-'+Date.now());
    const auth2=getAuth(app2);
    const cred=await signInWithEmailAndPassword(auth2,phoneEmail(d.phone),pw);
    await signOut(auth2);
    const uid=cred.user.uid, old=d.uid;
    if(uid===old){ toast('הנהג כבר מקושר נכון'); S.relink=null; render(); return; }
    await updateDoc(doc(db,'drivers',d.id),{uid});
    let n=0;
    for(const col of ['jobs','photos']){
      const snap=await getDocs(query(collection(db,col),where('driverUid','==',old)));
      for(const x of snap.docs){ await updateDoc(x.ref,{driverUid:uid}); if(col==='jobs')n++; }
    }
    S.relink=null; toast('הנהג קושר מחדש. עודכנו '+n+' עבודות'); render();
  }catch(e){ console.error(e);
    toast((e&&(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'))?'הסיסמה לא נכונה, או שאין כניסה למספר הזה':'הקישור נכשל, נסה שוב'); }
}
function relinkBox(d){
  if(S.relink!==d.id) return h('div',{style:'margin-top:6px'},h('button',{class:'btn small',type:'button',onclick:()=>{S.relink=d.id;relinkPw.value='';render();}},'קשר מחדש'));
  return h('div',{class:'acts',style:'margin-top:8px'},relinkPw,
    h('button',{class:'btn small primary',type:'button',onclick:()=>{ if(relinkPw.value.length>=6) relinkDriver(d,relinkPw.value); else toast('כתוב את הסיסמה הנוכחית של הנהג'); }},'אשר'),
    h('button',{class:'btn small',type:'button',onclick:()=>{S.relink=null;render();}},'ביטול'));
}
function driversView(){
  return [h('h2',{class:'sec',style:'margin-top:8px'},'נהגים'),driverForm,
    h('div',{class:'jobs'},S.drivers.length?S.drivers.map(d=>h('div',{class:'card row'},
      h('div',{},h('b',{},d.name),' ',h('span',{class:'veh'},d.vehicle+' · '),h('span',{class:'veh ltr'},d.phone),relinkBox(d)),
      h('button',{class:'btn small danger',type:'button',onclick:ev=>{
        const b=ev.currentTarget;
        if(b.dataset.armed){ run(deleteDoc(doc(db,'drivers',d.id)),'הנהג הוסר מהרשימה'); return; }
        b.dataset.armed='1'; b.textContent='לחץ שוב להסרה'; setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='הסר';}},3000);
      }},'הסר'))):h('div',{class:'none'},'עוד אין נהגים ברשימה.')),
    h('p',{class:'veh'},'הסרה מהרשימה לא מוחקת את הכניסה של הנהג. כדי לחסום כניסה מחק אותו גם ב-Firebase, בלשונית Authentication. אם נהג נכנס אבל לא רואה עבודות, לחץ אצלו "קשר מחדש" והקלד את הסיסמה שהוא נכנס איתה.')];
}
function teamView(){ return managersSection(); }

/* ---------- driver view ---------- */
function driverJob(j){
  const photoBtn=S.busy[j.id]
    ?h('button',{class:'btn big',type:'button',disabled:true},t('sending'))
    :h('label',{class:'btn big'+(j.photoAt?'':' primary'),for:'cam-'+j.id},j.photoAt?t('replacePhoto'):t('takePhoto'),
        h('input',{id:'cam-'+j.id,type:'file',accept:'image/*',capture:'environment',hidden:true,onchange:ev=>sendPhoto(j,ev.target.files[0])}));
  return h('article',{class:'card job'},
    h('div',{class:'row1'},timeBlock(j)),fields(j),
    j.confirmedAt
      ?h('div',{class:'pills'},h('span',{class:'pill ok'},t('youConfirmed',hhmm(j.confirmedAt))))
      :h('button',{class:'btn primary big',type:'button',onclick:()=>run(updateDoc(doc(db,'jobs',j.id),{confirmedAt:new Date().toISOString()}),t('confirmSent'))},t('confirmBtn')),
    h('div',{class:'acts'},photoBtn,j.photoAt?h('button',{class:'btn small',type:'button',onclick:()=>showPhoto(j)},t('viewDoc')):null),
    j.photoAt?h('div',{class:'pills'},h('span',{class:'pill ok'},t('docSentAt',hhmm(j.photoAt)))):null);
}
function driverView(){
  const list=S.jobs.slice().sort((a,b)=>((a.date||'')+(a.reportTime||'')).localeCompare((b.date||'')+(b.reportTime||'')));
  const out=[h('div',{class:'picker'},S.myDriver?t('hello',S.myDriver.name,S.myDriver.vehicle):'')];
  if(!S.ready) out.push(h('div',{class:'empty'},t('loadingSchedule')));
  else if(!list.length) out.push(h('div',{class:'empty card'},
    h('b',{},S.upcoming?t('noUpcoming'):t('noJobOn',fmtDate(S.date))),
    S.upcoming?t('noUpcomingHint'):t('noJobOnHint')));
  else{
    if(list.some(j=>!j.confirmedAt)) out.push(h('div',{class:'banner',role:'status'},t('needConfirm')));
    const days=[]; list.forEach(j=>{ let g=days.find(x=>x.date===j.date); if(!g){ g={date:j.date,jobs:[]}; days.push(g); } g.jobs.push(j); });
    days.forEach(g=>out.push(
      h('h2',{class:'sec',style:'margin:18px 2px 8px'},(g.date===today?t('todayPrefix'):g.date===addDays(today,1)?t('tomorrowPrefix'):'')+fmtDate(g.date)),
      h('div',{class:'jobs'},g.jobs.map(driverJob))));
  }
  out.push(h('details',{style:'margin-top:28px;color:var(--muted);font-size:.85rem'},h('summary',{},t('tech')),
    h('div',{dir:'ltr',style:'text-align:left;overflow-wrap:anywhere;padding-top:6px'},
      h('div',{},'login: '+(S.user.email||'')),
      h('div',{},'uid: '+S.user.uid),
      h('div',{},'driver record: '+(S.myDriver?S.myDriver.name+' (uid '+S.myDriver.uid+')':'NOT FOUND')),
      h('div',{},'my jobs loaded: '+S.mine.length+(S.mine.length?' | dates: '+S.mine.map(j=>j.date).sort().slice(0,6).join(', '):'')),
      h('div',{},'error: '+(S.dbErr||'none')))));
  return out;
}

/* ---------- shell ---------- */
const dateLbl=h('div',{class:'d'});
const shell=h('div',{class:'wrap'});
const main=h('main',{});
const tabBoard=h('button',{type:'button',onclick:()=>{S.view='board';render();}});
const tabYear=h('button',{type:'button',onclick:()=>{S.view='year';loadYear();}});
const tabDrivers=h('button',{type:'button',onclick:()=>{S.view='drivers';render();}});
const tabTeam=h('button',{type:'button',onclick:()=>{S.view='team';render();}});
const brandName=h('b',{}), brandSub=h('span',{});
const langHead=langSelect('langHead');
const logoutBtn=h('button',{class:'btn small',type:'button',onclick:()=>signOut(auth)});
const prevBtn=h('button',{class:'btn icon',type:'button',onclick:()=>setDate(addDays(S.date,-1))},'‹');
const nextBtn=h('button',{class:'btn icon',type:'button',onclick:()=>setDate(addDays(S.date,1))},'›');
const todayBtn=h('button',{class:'btn small',type:'button',onclick:()=>setDate(today,true)});
shell.append(
  h('header',{class:'top'},h('div',{class:'in'},
    h('div',{class:'brand'},brandName,brandSub),
    h('div',{class:'acts'},h('div',{class:'tabs',id:'tabs'},tabBoard,tabYear,tabDrivers,tabTeam),langHead,logoutBtn))),
  h('div',{class:'datebar',id:'datebar'},nextBtn,dateLbl,prevBtn,todayBtn),
  main);

function render(){
  if(!S.user)return;
  if(!root.contains(shell)) root.replaceChildren(shell);
  document.body.classList.toggle('mgr',!!S.isMgr);
  document.getElementById('tabs').hidden=false;
  brandName.textContent=t('appName'); brandSub.textContent=t('appSub');
  tabBoard.textContent=t('tabSchedule'); tabYear.textContent=t('tabCalendar'); tabDrivers.textContent='נהגים'; tabTeam.textContent='צוות';
  logoutBtn.textContent=t('logout'); todayBtn.textContent=t('today');
  prevBtn.setAttribute('aria-label',t('prevDay')); nextBtn.setAttribute('aria-label',t('nextDay'));
  langHead.value=LANG; langHead.hidden=S.isMgr;
  if(S.view==='drivers'&&!S.isMgr) S.view='board';
  if(S.view==='team'&&!S.isOwner) S.view='board';
  tabDrivers.hidden=!S.isMgr; tabTeam.hidden=!S.isOwner;
  tabTeam.setAttribute('aria-pressed',S.view==='team');
  tabBoard.setAttribute('aria-pressed',S.view==='board'); tabYear.setAttribute('aria-pressed',S.view==='year'); tabDrivers.setAttribute('aria-pressed',S.view==='drivers');
  const showDate=S.view==='board'; document.getElementById('datebar').hidden=!showDate;
  dateLbl.textContent=(!S.isMgr&&S.upcoming)?t('upcoming'):(S.date===today?t('todayPrefix'):'')+fmtDate(S.date);
  main.replaceChildren(...(S.view==='year'?yearView():(S.isMgr?(S.view==='drivers'?driversView():S.view==='team'?teamView():boardView()):driverView())));
}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ymd(new Date())!==today) location.reload(); });

onAuthStateChanged(auth,user=>{
  if(user) startSession(user);
  else { S.user=null; showLogin(); }
});
</script>

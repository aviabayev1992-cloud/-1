window.__errs=[];
addEventListener('error',function(e){window.__errs.push(e.message||'error')});
addEventListener('unhandledrejection',function(e){window.__errs.push(String((e.reason&&e.reason.message)||e.reason))});

<div id="root"><p style="text-align:center;margin-top:30vh;color:var(--muted)">טוען...</p></div>
<div id="layer"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword}
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,getDoc,getDocs,query,where,onSnapshot}
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== להשלמה לפני העלאה ====== */
const firebaseConfig={
  apiKey:"AIzaSyCMVrNlP-2Wjj4j-1--N-Nm6oMbUH2UHdU",
  authDomain:"uzi-manofim.firebaseapp.com",
  projectId:"uzi-manofim",
  storageBucket:"uzi-manofim.firebasestorage.app",
  messagingSenderId:"425633549458",
  appId:"1:425633549458:web:aaacd90c91d44e82316a4b"
};
const MANAGER_EMAIL="aviabayev1992@gmail.com";
/* =============================== */

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=ymd(new Date());
const fmtDate=s=>parse(s).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const hhmm=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const jobsWord=n=>n===1?'עבודה אחת':n+' עבודות';
const phoneEmail=p=>p.replace(/\D/g,'')+'@drivers.uzi-manofim.app';
const userEmail=u=>u.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@managers.uzi-manofim.app';
const sorted=a=>a.slice().sort((x,y)=>(x.reportTime||'').localeCompare(y.reportTime||''));

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){ if(kid==null||kid===false)continue; e.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return e;
}
function toast(msg){ const t=h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),3500); }
const root=document.getElementById('root');
/* ---------- install banner: Android install button, iPhone instructions ---------- */
(function(){
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone) return;
  try{ if(localStorage.getItem('noInstall')==='1') return; }catch(e){}
  const ua=navigator.userAgent;
  const ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inApp=/FBAN|FBAV|Instagram|Line\/|; wv\)/i.test(ua);
  let deferred=null;
  const msg=h('span',{});
  const act=h('button',{class:'btn small primary',type:'button',hidden:true});
  const bar=h('div',{class:'install',hidden:true,role:'region','aria-label':'התקנה'},msg,act,
    h('button',{class:'btn small',type:'button','aria-label':'סגור',onclick:()=>{bar.hidden=true;try{localStorage.setItem('noInstall','1');}catch(e){}}},'✕'));
  document.body.append(bar);
  function show(text,btnText,fn){ msg.textContent=text; if(btnText){act.textContent=btnText;act.onclick=fn;act.hidden=false;}else act.hidden=true; bar.hidden=false; }
  addEventListener('beforeinstallprompt',e=>{
    e.preventDefault(); deferred=e;
    show('אפשר להתקין את האפליקציה על הטלפון','התקן',async()=>{ try{ deferred.prompt(); await deferred.userChoice; }catch(_){} deferred=null; bar.hidden=true; });
  });
  addEventListener('appinstalled',()=>{bar.hidden=true;});
  if(inApp) show('כדי להתקין, פתח את הקישור בדפדפן (Chrome באנדרואיד, Safari באייפון)');
  else if(ios) show('להתקנה: לחץ על כפתור השיתוף (ריבוע עם חץ) ואז על "הוסף למסך הבית"');
})();


if(firebaseConfig.apiKey.startsWith('PASTE')||MANAGER_EMAIL.startsWith('PASTE')){
  root.append(h('div',{class:'login card'},h('h1',{},'האפליקציה עוד לא הוגדרה'),h('p',{},'צריך להדביק בקובץ את הגדרות Firebase ואת כתובת המייל של המנהל.')));
  throw new Error('config missing');
}

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const S={user:null,isMgr:false,view:'board',date:today,jobs:[],drivers:[],myDriver:null,ready:false,formOpen:false,busy:{},isOwner:false,managers:[],upcoming:true,mine:[],pack:null,packing:false,year:new Date().getFullYear(),yearData:null,yearLoading:false};
let unsubs=[];
const stopAll=()=>{unsubs.forEach(u=>u());unsubs=[];};
let jobsUnsub=null;
const withDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));

async function run(p,okMsg){
  try{ await p; if(okMsg) toast(okMsg); return true; }
  catch(e){ console.error(e); toast(e&&e.code==='permission-denied'?'אין הרשאה לפעולה הזו':'הפעולה נכשלה, נסה שוב'); return false; }
}

/* ---------- login ---------- */
function showLogin(){
  stopAll(); if(jobsUnsub){jobsUnsub();jobsUnsub=null;}
  const err=h('div',{class:'err',role:'alert'});
  const u=h('input',{id:'u',type:'text',autocomplete:'username',autocapitalize:'none',inputmode:'email',required:true,placeholder:'מספר טלפון'});
  const p=h('input',{id:'p',type:'password',autocomplete:'current-password',required:true});
  const btn=h('button',{class:'btn primary',type:'submit'},'כניסה');
  root.replaceChildren(h('form',{class:'login card',onsubmit:async ev=>{
    ev.preventDefault(); err.textContent=''; btn.disabled=true;
    const name=u.value.trim(); const email=name.includes('@')?name:(/^[\d\s+()-]+$/.test(name)?phoneEmail(name):userEmail(name));
    try{ await signInWithEmailAndPassword(auth,email,p.value); }
    catch(e){ err.textContent=(e.code==='auth/network-request-failed')?'אין חיבור לאינטרנט':'שם משתמש או סיסמה שגויים'; }
    btn.disabled=false;
  }},
    h('h1',{},'עוזי מנופים'),h('p',{},'סידור עבודה'),
    h('label',{for:'u'},'מספר טלפון (נהג) או שם משתמש (מנהל)',u),
    h('label',{for:'p'},'סיסמה',p),err,btn));
}

/* ---------- data ---------- */
let prevJobs=null;
function watchJobs(){
  if(jobsUnsub){jobsUnsub();jobsUnsub=null;}
  S.ready=false; prevJobs=null; S.pack=null;
  const q=S.isMgr
    ?query(collection(db,'jobs'),where('date','==',S.date))
    :query(collection(db,'jobs'),where('driverUid','==',S.user.uid));
  jobsUnsub=onSnapshot(q,s=>{
    const list=withDocs(s);
    if(prevJobs){
      list.forEach(j=>{
        const old=prevJobs.get(j.id);
        const who=(S.drivers.find(d=>d.id===j.driverId)||{}).name||'נהג';
        if(S.isMgr){
          if(old&&!old.confirmedAt&&j.confirmedAt) toast(who+' אישר קבלת סידור');
          if(old&&!old.photoAt&&j.photoAt) toast('התקבלה תעודה מ'+who);
        }else if(!old){ toast('נוספה לך עבודה חדשה'); }
      });
    }
    prevJobs=new Map(list.map(j=>[j.id,j]));
    if(S.isMgr) S.jobs=list; else { S.mine=list; deriveMine(); }
    S.ready=true; render();
  },()=>toast('החיבור לנתונים נקטע, טען מחדש'));
}
async function startSession(user){
  const email=(user.email||'').toLowerCase();
  const owner=email===MANAGER_EMAIL.toLowerCase();
  let mgr=owner;
  if(!mgr){ try{ mgr=(await getDoc(doc(db,'managers',email))).exists(); }catch(e){ mgr=false; } }
  if(!auth.currentUser||auth.currentUser.uid!==user.uid) return;
  S.user=user; S.isOwner=owner; S.isMgr=mgr; S.managers=[];
  S.view='board'; S.date=today; S.upcoming=true; S.mine=[]; S.jobs=[]; S.drivers=[]; S.myDriver=null; S.yearData=null; S.pack=null;
  if(S.isMgr){
    unsubs.push(onSnapshot(collection(db,'managers'),s=>{S.managers=withDocs(s).sort((a,b)=>(a.email||'').localeCompare(b.email||''));render();},()=>{}));
    unsubs.push(onSnapshot(collection(db,'drivers'),s=>{S.drivers=withDocs(s).sort((a,b)=>a.name.localeCompare(b.name,'he'));render();},()=>toast('לא ניתן לטעון נהגים')));
  }else{
    unsubs.push(onSnapshot(query(collection(db,'drivers'),where('uid','==',user.uid)),s=>{S.myDriver=withDocs(s)[0]||null;render();}));
  }
  watchJobs(); render();
}
function deriveMine(){ S.jobs=S.upcoming?S.mine.filter(j=>j.date>=today):S.mine.filter(j=>j.date===S.date); }
function setDate(d,up){
  S.date=d; S.upcoming=!!up;
  if(S.isMgr){ S.jobs=[]; watchJobs(); } else deriveMine();
  render();
}

/* ---------- photos ---------- */
async function shrink(file,max,q,limit){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  let out=c.toDataURL('image/jpeg',q);
  while(out.length>limit&&q>0.3){q-=0.1;out=c.toDataURL('image/jpeg',q);}
  return out;
}
async function sendPhoto(job,file){
  if(!file)return;
  S.busy[job.id]=true; render();
  try{
    const data=await shrink(file,1200,0.65,220000);

/* ---------- manager: send the day's work orders by email (via the phone's share sheet) ---------- */
async function preparePack(){
  S.packing=true; render();
  try{
    const out=[]; let i=0;
    for(const j of S.jobs.filter(j=>j.photoAt)){
      const snap=await getDoc(doc(db,'photos',j.id)); if(!snap.exists())continue;
      const blob=await (await fetch(snap.data().data)).blob();
      const drv=S.drivers.find(d=>d.id===j.driverId);
      i++;
      const name=((drv?drv.name:'נהג')+'-'+(j.customer||'עבודה')+'-'+j.date+'-'+i+'.jpg').replace(/[\\/:*?"<>|]+/g,'_');
      const file=new File([blob],name,{type:'image/jpeg'});
      out.push({file,name,url:URL.createObjectURL(file)});
    }
    S.pack=out;
  }catch(e){ console.error(e); toast('ההכנה נכשלה, נסה שוב'); }
  S.packing=false; render();
}
async function sharePack(){
  try{ await navigator.share({files:S.pack.map(p=>p.file),title:'תעודות עבודה '+fmtDate(S.date)}); }
  catch(e){ if(e&&e.name!=='AbortError') toast('השיתוף נכשל'); }
}
function packBox(){
  const n=S.jobs.filter(j=>j.photoAt).length;
  if(!n) return null;
  if(!S.pack) return h('button',{class:'btn',type:'button',disabled:S.packing,onclick:preparePack},S.packing?'מכין תעודות...':'הכן '+n+' תעודות לשליחה במייל');
  if(!S.pack.length) return h('span',{class:'veh'},'לא נמצאו תמונות');
  const can=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:S.pack.map(p=>p.file)}));
  return h('div',{class:'acts'},
    can?h('button',{class:'btn primary',type:'button',onclick:sharePack},'שתף '+S.pack.length+' תעודות (בחר Gmail)')
       :S.pack.map(p=>h('a',{class:'btn small',href:p.url,download:p.name},'הורד '+p.name)));
}

/* ---------- manager: year calendar ---------- */
const MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DOW=['א','ב','ג','ד','ה','ו','ש'];
async function loadYear(force){
  if(!force&&S.yearData&&S.yearData.year===S.year){render();return;}
  S.yearLoading=true; render();
  try{
    const y=S.year;
    const q=S.isMgr
      ?query(collection(db,'jobs'),where('date','>=',y+'-01-01'),where('date','<=',y+'-12-31'))
      :query(collection(db,'jobs'),where('driverUid','==',S.user.uid));
    const snap=await getDocs(q);
    const days={};
    snap.forEach(d=>{ const j=d.data(); if(!j.date||j.date.slice(0,4)!==String(y))return; const o=days[j.date]||(days[j.date]={n:0,wait:0}); o.n++; if(!j.confirmedAt)o.wait++; });
    S.yearData={year:y,days};
  }catch(e){ console.error(e); toast('לא ניתן לטעון את היומן'); }
  S.yearLoading=false; render();
}
function yearView(){
  const y=S.year, data=(S.yearData&&S.yearData.year===y)?S.yearData.days:{};
  const out=[
    h('div',{class:'yearbar'},
      h('button',{class:'btn icon',type:'button','aria-label':'שנה הבאה',onclick:()=>{S.year++;loadYear();}},'›'),
      h('b',{},String(y)),
      h('button',{class:'btn icon',type:'button','aria-label':'שנה קודמת',onclick:()=>{S.year--;loadYear();}},'‹'),
      h('button',{class:'btn small',type:'button',disabled:S.yearLoading,onclick:()=>loadYear(true)},S.yearLoading?'טוען...':'רענן')),
    h('p',{class:'legend'},h('span',{},h('i',{style:'background:var(--accent-soft)'}),'יש עבודות (המספר הוא כמה)'),h('span',{},h('i',{style:'border:2px solid var(--warn)'}),S.isMgr?'יש מי שעוד לא אישר':'עוד לא אישרת'))];
  const grid=h('div',{class:'months'});
  for(let m=0;m<12;m++){
    const first=new Date(y,m,1), count=new Date(y,m+1,0).getDate(), cells=[];
    for(let i=0;i<first.getDay();i++) cells.push(h('span',{class:'dc off'}));
    for(let d=1;d<=count;d++){
      const ds=y+'-'+pad(m+1)+'-'+pad(d), info=data[ds];
      cells.push(h('button',{type:'button',class:'dc'+(info?' has':'')+(info&&info.wait?' wait':'')+(ds===today?' today':''),
        'aria-label':fmtDate(ds)+(info?', '+jobsWord(info.n):''),onclick:()=>{S.view='board';setDate(ds);}},
        h('span',{},String(d)),info?h('small',{},String(info.n)):null));
    }
    grid.append(h('section',{class:'month card'},h('h3',{},MONTHS[m]),h('div',{class:'dow'},DOW.map(x=>h('span',{},x))),h('div',{class:'days'},cells)));
  }
  out.push(grid);
  return out;
}

  else if(!list.length) out.push(h('div',{class:'empty card'},
    h('b',{},S.upcoming?'אין לך עבודות קרובות':'אין לך עבודה ב'+fmtDate(S.date)),
    S.upcoming?'כשהמנהל ישייך לך עבודה היא תופיע כאן.':'אפשר לדפדף בין הימים עם החצים, או לפתוח את לשונית "שנה".'));
  else{
    if(list.some(j=>!j.confirmedAt)) out.push(h('div',{class:'banner',role:'status'},'יש עבודה שממתינה לאישור שלך'));
    const days=[]; list.forEach(j=>{ let g=days.find(x=>x.date===j.date); if(!g){ g={date:j.date,jobs:[]}; days.push(g); } g.jobs.push(j); });
    days.forEach(g=>out.push(
      h('h2',{class:'sec',style:'margin:18px 2px 8px'},(g.date===today?'היום, ':g.date===addDays(today,1)?'מחר, ':'')+fmtDate(g.date)),
      h('div',{class:'jobs'},g.jobs.map(driverJob))));
  }
  return out;
}

/* ---------- shell ---------- */
const dateLbl=h('div',{class:'d'});
const shell=h('div',{class:'wrap'});
const main=h('main',{});
const tabBoard=h('button',{type:'button',onclick:()=>{S.view='board';render();}},'סידור');
const tabYear=h('button',{type:'button',onclick:()=>{S.view='year';loadYear();}},'שנה');
const tabDrivers=h('button',{type:'button',onclick:()=>{S.view='drivers';render();}},'נהגים');
const tabTeam=h('button',{type:'button',onclick:()=>{S.view='team';render();}},'צוות');
shell.append(
  h('header',{class:'top'},h('div',{class:'in'},
    h('div',{class:'brand'},h('b',{},'עוזי מנופים'),h('span',{},'סידור עבודה')),
    h('div',{class:'acts'},h('div',{class:'tabs',id:'tabs'},tabBoard,tabYear,tabDrivers,tabTeam),
      h('button',{class:'btn small',type:'button',onclick:()=>signOut(auth)},'יציאה')))),
  h('div',{class:'datebar',id:'datebar'},
    h('button',{class:'btn icon',type:'button','aria-label':'היום הבא',onclick:()=>setDate(addDays(S.date,1))},'›'),dateLbl,
    h('button',{class:'btn icon',type:'button','aria-label':'היום הקודם',onclick:()=>setDate(addDays(S.date,-1))},'‹'),
    h('button',{class:'btn small',type:'button',onclick:()=>setDate(today,true)},'היום')),
  main);

function render(){
  if(!S.user)return;
  if(!root.contains(shell)) root.replaceChildren(shell);
  document.getElementById('tabs').hidden=false;
  if(S.view==='drivers'&&!S.isMgr) S.view='board';
  if(S.view==='team'&&!S.isOwner) S.view='board';
  tabDrivers.hidden=!S.isMgr; tabTeam.hidden=!S.isOwner;
  tabTeam.setAttribute('aria-pressed',S.view==='team');
  tabBoard.setAttribute('aria-pressed',S.view==='board'); tabYear.setAttribute('aria-pressed',S.view==='year'); tabDrivers.setAttribute('aria-pressed',S.view==='drivers');
  const showDate=S.view==='board'; document.getElementById('datebar').hidden=!showDate;
  dateLbl.textContent=(!S.isMgr&&S.upcoming)?'העבודות הקרובות':(S.date===today?'היום, ':'')+fmtDate(S.date);
  main.replaceChildren(...(S.view==='year'?yearView():(S.isMgr?(S.view==='drivers'?driversView():S.view==='team'?teamView():boardView()):driverView())));
}

document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ymd(new Date())!==today) location.reload(); });

onAuthStateChanged(auth,user=>{
  if(user) startSession(user);
  else { S.user=null; showLogin(); }
});
</script>
</body>
